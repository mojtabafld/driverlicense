# Builds the Android app (an APK to install directly, arm64 phones) from mobile/ when run by hand, and
# publishes it as a GitHub Release «Android build N» with the file teoriprove.apk. Run it by hand from the Actions tab
# too («Run workflow»).
#
# N, the release number, counts from 1 since 2026-10-11 (the owner asked; the releases before it, tagged android-*, are
# deleted by this workflow): one more than the highest release-N there is, so a cancelled run skips no number. The APK's
# versionCode stays the run number, so a new APK still installs over the ones built before.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 (the .jks file in base64), ANDROID_KEYSTORE_PASSWORD
# and ANDROID_KEY_ALIAS every build is signed with that key, so a new APK installs over the old one. Without them a
# key is made once and kept in the Actions cache (it is lost if no build runs for a week; then uninstall the app once
# before installing the next APK).
name: Android APK

# Only by hand (the owner asked, 2026-10-10: an APK is built and published only when he asks for one), from the Actions
# tab or the API.
on:
  workflow_dispatch:
    inputs:
      copy:
        description: "main: the main site's app; prove: the app of teori.bitlane.app/app (prove.dk's bank and lessons)"
        type: choice
        options: [main, prove]
        default: main

permissions:
  contents: write

concurrency:
  group: android-apk-${{ inputs.copy || 'main' }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # prove: the /app copy's app (mobile/app.config.js: its own name and package; lib/config.ts: PROVE_BANK), released as
      # «Android /app build N» (tags prove-N, file teoriprove-prove.apk), never as the latest release (the main app's).
      EXPO_PUBLIC_PROVE: ${{ inputs.copy == 'prove' && '1' || '' }}
      TAG: ${{ inputs.copy == 'prove' && 'prove' || 'release' }}
      APK: ${{ inputs.copy == 'prove' && 'teoriprove-prove.apk' || 'teoriprove.apk' }}
    steps:
      - uses: actions/checkout@v4

      - name: Release number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 500 --json tagName --jq '.[].tagName' | { grep -E "^${TAG}-[0-9]+$" || true; } | sed "s/${TAG}-//" | sort -n | tail -1)
          echo "RELEASE_N=$(( ${last:-0} + 1 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # The native Android project, made from app.json (it is not kept in the repository).
      - run: npx expo prebuild --platform android --no-install

      # The signing key: from the secrets, else the one kept in the cache, else a new one.
      - name: Signing key from secrets
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Cached signing key
        if: env.HAS_KEY != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.teoriprove-key
          key: teoriprove-android-key-v1
      - name: Signing key (cache or new)
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASS=$PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          else
            mkdir -p ~/.teoriprove-key
            if [ ! -f ~/.teoriprove-key/release.jks ]; then
              keytool -genkeypair -v -keystore ~/.teoriprove-key/release.jks -storepass teoriprove -keypass teoriprove \
                -alias teoriprove -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TeoriProve"
            fi
            echo "STORE=$HOME/.teoriprove-key/release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASS=teoriprove" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=teoriprove" >> "$GITHUB_ENV"
          fi

      # Version: the build number, so each APK counts as newer; release signing with the key above.
      - name: Version and signing in the Gradle project
        run: |
          cd android/app
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"([^\"]+)\"/versionName \"\1 (${RELEASE_N})\"/" build.gradle
          cat >> build.gradle <<GRADLE

          android {
              signingConfigs {
                  teoriprove {
                      storeFile file(System.getenv("STORE"))
                      storePassword System.getenv("STORE_PASS")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("STORE_PASS")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.teoriprove } }
          }
          GRADLE
          grep -E "versionCode|versionName" build.gradle

      # More room for Gradle's class metadata (with expo-updates the lint step ran out of Metaspace and the build hung
      # until the time limit), and no release lint (it checks nothing the app needs and took the most memory).
      - name: Build the APK
        run: |
          cd android
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          # A new line first: the file ends without one, and the setting would run into its last line.
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8\n' >> gradle.properties
          printf '\nandroid { lint { checkReleaseBuilds false } }\n' >> app/build.gradle
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Collect
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/$APK"
          ls -la "$RUNNER_TEMP/out"

      # A copy for the run page only; the release below is what counts, so a full artifact storage quota does not stop it.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.TAG }}-apk
          path: ${{ runner.temp }}/out/${{ env.APK }}

      # The releases of the old numbering (tags android-1 … android-110): removed, with their tags.
      - name: Remove the old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 500 --json tagName --jq '.[].tagName' | { grep '^android-' || true; } | while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}-${{ env.RELEASE_N }}
          name: ${{ inputs.copy == 'prove' && 'Android /app build' || 'Android build' }} ${{ env.RELEASE_N }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ inputs.copy != 'prove' }}
          body: |
            ${{ inputs.copy == 'prove' && 'TeoriPrøve Prove, the app of teori.bitlane.app/app (prove.dk''s question bank and lessons)' || 'TeoriPrøve' }} for Android (arm64), build ${{ env.RELEASE_N }} from ${{ github.sha }}.
            Download ${{ env.APK }} on the phone and open it to install.
          files: ${{ runner.temp }}/out/${{ env.APK }}
