<!DOCTYPE html>
<!-- The admin dashboard at teori.bitlane.app/admin: sign in (an admin account, ADMIN_USERS), then the app's users and how
     they use it, from /api/adminstats: the totals (users, active today and in 7 days, exams, premium, guests, unconfirmed
     emails, payments), the last 30 days (exams, active users, new users, visits), and every user (state, email, premium
     until, exams, scores, last activity) with a search and filters; a row opens its details. The reports sent from the
     app («گزارش خطا»; each also emailed to the admins) at the bottom, and the emails Resend received for the domain
     (its receiving webhook, /api/inbound). At the top, the AI's daily report (insights.js, /api/insights): what it found,
     what it suggests for the next updates, its memory, the pages used, and the notes it proposes for the questions most
     answered wrongly, each approved (as edited) or rejected here (/api/qnote); «گزارش تازه» makes one now
     (/api/insightsrun). It talks to /api/login, /api/logout, /api/adminstats and those. -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teoripro Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f7;--surface:#fff;--surface2:#eef1f3;--line:#dde2e6;--text:#1c2226;--muted:#6b757d;--accent:#2e8285;--ok:#1f9a4a;--okSoft:#e3f5ea;--bad:#d64545;--badSoft:#fbe9e9;--warn:#b7791f;--warnSoft:#fbf1df;--bar:#2e8285;--bar2:#9ccfd0}
@media (prefers-color-scheme:dark){:root{--bg:#121516;--surface:#1c2022;--surface2:#262b2e;--line:#333a3e;--text:#e8ecee;--muted:#9aa4aa;--accent:#4fb3b6;--ok:#4cc47a;--okSoft:#1c3326;--bad:#ef6b6b;--badSoft:#3a2222;--warn:#e0a84a;--warnSoft:#3a2f1c;--bar:#4fb3b6;--bar2:#2b5c5e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn',system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
main{max-width:1200px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer}
.btn.soft{background:var(--surface2);color:var(--text)}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--surface);color:var(--text);cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--text)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.grow{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .n{font-size:24px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}
.tile .l{font-size:12.5px;color:var(--muted)}
.tile .s{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:16px}
@media (max-width:820px){.row2{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:middle}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.bars .t{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bars .t span{display:block;height:100%;background:var(--bar);border-radius:5px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
th{font-weight:700;color:var(--muted);text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
tr.u{cursor:pointer}
tr.u:hover td{background:var(--surface2)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 9px;white-space:nowrap}
.tag.premium,.tag.admin{background:var(--okSoft);color:var(--ok)}
.tag.trial{background:var(--warnSoft);color:var(--warn)}
.tag.free{background:var(--surface2);color:var(--muted)}
.tag.expired,.tag.unv{background:var(--badSoft);color:var(--bad)}
.tag.guest{background:var(--surface2);color:var(--text)}
.ltr{direction:ltr;unicode-bidi:isolate}
.detail td{background:var(--surface2)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 16px;font-size:13px}
.kv b{font-weight:700}
.reports .r{border-bottom:1px solid var(--line);padding:10px 0}
.reports .r:last-child{border:0}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
.tag.high{background:var(--badSoft);color:var(--bad)}.tag.medium{background:var(--warnSoft);color:var(--warn)}.tag.low{background:var(--surface2);color:var(--muted)}
.news input,.news textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--surface);color:var(--text);margin-top:6px}
.news textarea{min-height:80px}
details summary{cursor:pointer;font-weight:700}
.login{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
</style>
</head>
<body>
<main id="app"><p class="muted">در حال بارگذاری…</p></main>
<script>
(() => {
  const $app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fa = n => n == null ? '–' : Number(n).toLocaleString('fa-IR');
  const when = t => t ? new Date(t).toLocaleString('fa-IR', { dateStyle: 'medium', timeStyle: 'short' }) : '–';
  const day = t => t ? new Date(t).toLocaleDateString('fa-IR', { dateStyle: 'medium' }) : '–';
  const ago = t => {
    if (!t) return '–';
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'همین الان'; if (m < 60) return `${fa(m)} دقیقه پیش`;
    const h = Math.round(m / 60); if (h < 24) return `${fa(h)} ساعت پیش`;
    return `${fa(Math.round(h / 24))} روز پیش`;
  };
  async function api(method, route, body) {
    const r = await fetch('/api/' + route, { method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(d.error || 'خطا'), { status: r.status });
    return d;
  }

  function login(msg = '') {
    $app.innerHTML = `<form class="card login" id="f">
      <h1>داشبورد Teoripro</h1>
      <p class="muted" style="margin:0">کاربران و استفاده از برنامه؛ فقط برای مدیران.</p>
      <input name="u" placeholder="نام کاربری یا ایمیل" autocomplete="username" dir="ltr" required>
      <input name="p" type="password" placeholder="رمز عبور" autocomplete="current-password" dir="ltr" required>
      <div class="err" id="err">${esc(msg)}</div>
      <button class="btn">ورود</button>
    </form>`;
    const f = document.getElementById('f');
    f.u.focus();
    f.onsubmit = async e => {
      e.preventDefault();
      try { const d = await api('POST', 'login', { username: f.u.value, password: f.p.value }); if (!d.user.admin) { await api('POST', 'logout').catch(() => {}); return login('این حساب دسترسی مدیریت ندارد.'); } view(); }
      catch (er) { document.getElementById('err').textContent = er.message; }
    };
  }

  const PASS = { admin: 'مدیر', premium: 'ویژه', trial: 'آزمایشی', expired: 'تمام‌شده', free: 'رایگان' };
  const MODE = { random: 'تصادفی', mistakes: 'اشتباهات', top: 'پرتکرار', lesson: 'درس', sections: 'بخش‌ها' };
  const UI = { fa: 'فارسی', en: 'English', da: 'Dansk' };
  const state = { q: '', filter: 'all', sort: 'lastActive', dir: -1, open: null, data: null, ai: null, aiMsg: '' };
  // The last 30 days: exams as bars, active users as a line, new users as dots under each bar.
  function chart(days) {
    const W = 720, H = 220, P = { l: 30, r: 8, t: 10, b: 26 }, n = days.length;
    const max = Math.max(4, ...days.map(d => Math.max(d.tests, d.active)));
    const step = (W - P.l - P.r) / n, bw = Math.max(4, step * 0.62);
    const y = v => P.t + (H - P.t - P.b) * (1 - v / max);
    const ticks = [0, Math.round(max / 2), max];
    let g = ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${y(v) + 4}" font-size="10" fill="var(--muted)" text-anchor="end">${fa(v)}</text>`).join('');
    days.forEach((d, i) => {
      const x = P.l + i * step + (step - bw) / 2;
      g += `<rect x="${x}" y="${y(d.tests)}" width="${bw}" height="${Math.max(0, y(0) - y(d.tests))}" rx="2" fill="var(--bar)"><title>${esc(d.day)}: ${fa(d.tests)} آزمون، ${fa(d.active)} کاربر فعال، ${fa(d.newUsers)} کاربر تازه</title></rect>`;
      if (d.newUsers) g += `<circle cx="${x + bw / 2}" cy="${H - P.b + 8}" r="${Math.min(6, 2 + d.newUsers)}" fill="var(--warn)"><title>${fa(d.newUsers)} کاربر تازه</title></circle>`;
      if (i % 5 === 0 || i === n - 1) g += `<text x="${x + bw / 2}" y="${H - 2}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(d.day.slice(5))}</text>`;
    });
    const pts = days.map((d, i) => `${P.l + i * step + step / 2},${y(d.active)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="var(--text)" stroke-width="1.6" stroke-linejoin="round"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="۳۰ روز اخیر">${g}</svg>
      <div class="legend"><span><i style="background:var(--bar)"></i>آزمون‌ها</span><span><i style="background:var(--text);height:2px"></i>کاربران فعال</span><span><i style="background:var(--warn);border-radius:50%"></i>کاربر تازه</span></div>`;
  }
  const bars = (obj, names) => {
    const list = Object.entries(obj).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]), max = Math.max(1, ...list.map(x => x[1]));
    return list.length ? `<div class="bars">${list.map(([k, v]) => `<div class="b"><span>${esc(names[k] || k)}</span><div class="t"><span style="width:${v / max * 100}%"></span></div><span>${fa(v)}</span></div>`).join('')}</div>` : '<p class="muted">هنوز چیزی نیست.</p>';
  };

  const FILTERS = [['all', 'همه'], ['premium', 'ویژه'], ['free', 'رایگان'], ['guest', 'مهمان'], ['unv', 'ایمیل تأییدنشده'], ['today', 'فعال امروز'], ['week', 'فعال این هفته']];
  const inFilter = u => {
    const f = state.filter;
    if (f === 'premium') return u.pass === 'premium' || u.pass === 'trial' || u.pass === 'admin';
    if (f === 'free') return (u.pass === 'free' || u.pass === 'expired') && !u.guest;
    if (f === 'guest') return u.guest;
    if (f === 'unv') return u.verifyPending;
    if (f === 'today') return Date.now() - u.lastActive < 864e5;
    if (f === 'week') return Date.now() - u.lastActive < 7 * 864e5;
    return true;
  };
  const COLS = [['name', 'کاربر'], ['pass', 'وضعیت'], ['created', 'عضویت'], ['lastActive', 'آخرین فعالیت'], ['activeDays', 'روزهای فعال'], ['tests', 'آزمون‌ها'], ['tests7', '۷ روز'], ['passed', 'قبولی کامل'], ['avgPct', 'میانگین'], ['lastPct', 'آخرین'], ['ui', 'زبان']];

  function usersTable(users) {
    const q = state.q.trim().toLowerCase();
    let list = users.filter(u => inFilter(u) && (!q || [u.name, u.username, u.email].some(x => String(x || '').toLowerCase().includes(q))));
    const k = state.sort;
    list = list.slice().sort((a, b) => { const x = a[k] ?? -1, y = b[k] ?? -1; return (typeof x === 'string' ? x.localeCompare(y) : x - y) * state.dir; });
    const rows = list.map(u => {
      const tags = `<span class="tag ${u.pass}">${PASS[u.pass]}</span>${u.guest ? ' <span class="tag guest">مهمان</span>' : ''}${u.verifyPending ? ' <span class="tag unv">تأییدنشده</span>' : ''}`;
      const main = `<tr class="u" data-u="${esc(u.username)}">
        <td><b>${esc(u.name)}</b><div class="muted ltr" style="font-size:12px">${esc(u.email || u.username)}</div></td>
        <td>${tags}${u.until && u.pass !== 'free' ? `<div class="muted" style="font-size:12px">تا ${day(u.until)}</div>` : ''}</td>
        <td>${day(u.created)}</td><td title="${esc(when(u.lastActive))}">${ago(u.lastActive)}</td><td>${fa(u.activeDays)}</td>
        <td>${fa(u.tests)}${u.testsToday ? ` <span class="muted">(${fa(u.testsToday)} امروز)</span>` : ''}</td><td>${fa(u.tests7)}</td>
        <td>${fa(u.passed)} / ${fa(u.full)}</td><td>${u.avgPct == null ? '–' : fa(u.avgPct) + '٪'}</td><td>${u.lastPct == null ? '–' : fa(u.lastPct) + '٪'}</td>
        <td>${esc(UI[u.ui] || '–')}</td></tr>`;
      if (state.open !== u.username) return main;
      const modes = Object.entries(u.modes || {}).map(([m, v]) => `${esc(MODE[m] || m)}: ${fa(v)}`).join('، ') || '–';
      return main + `<tr class="detail"><td colspan="${COLS.length}"><div class="kv">
        <div>نام کاربری: <b class="ltr">${esc(u.username)}</b></div>
        <div>ایمیل: <b class="ltr">${esc(u.email || '–')}</b> ${u.email ? (u.emailOk ? '✓' : '(تأییدنشده)') : ''}</div>
        <div>عضویت: <b>${when(u.created)}</b></div>
        <div>آخرین فعالیت: <b>${when(u.lastActive)}</b></div>
        <div>نسخه‌ی ویژه: <b>${PASS[u.pass]}${u.plan ? ` (${esc(u.plan)})` : ''}</b>${u.until ? ` تا ${when(u.until)}` : ''}</div>
        <div>کد تخفیف: <b>${u.promo ? 'استفاده شده' : 'نه'}</b></div>
        <div>پرداخت‌ها: <b>${fa(Math.round((u.paid || 0) / 100))} kr</b></div>
        <div>آزمون‌ها بر اساس نوع: <b>${modes}</b></div>
        <div>آزمون کامل: <b>${fa(u.full)}</b>، قبولی: <b>${fa(u.passed)}</b></div>
        <div>سؤال‌های ذخیره‌شده: <b>${fa(u.saved)}</b></div>
        <div>واژه‌ها: <b>${fa(u.words)}</b></div>
        <div>زبان سؤال‌ها: <b>${esc(u.lang || '–')}</b></div>
      </div></td></tr>`;
    }).join('');
    const arrow = k => state.sort === k ? (state.dir < 0 ? ' ↓' : ' ↑') : '';
    return `<div class="toolbar">
        <input id="q" placeholder="جست‌وجوی نام یا ایمیل" value="${esc(state.q)}" style="flex:1;min-width:200px">
        ${FILTERS.map(([k, l]) => `<button class="chip${state.filter === k ? ' on' : ''}" data-f="${k}">${l}</button>`).join('')}
      </div>
      <p class="muted" style="margin:0 0 6px;font-size:12.5px">${fa(list.length)} کاربر؛ برای جزئیات روی هر ردیف بزنید.</p>
      <div class="tablewrap"><table><thead><tr>${COLS.map(([k, l]) => `<th data-s="${k}">${l}${arrow(k)}</th>`).join('')}</tr></thead><tbody>${rows || `<tr><td colspan="${COLS.length}" class="muted">کاربری پیدا نشد.</td></tr>`}</tbody></table></div>`;
  }

  function render() {
    const d = state.data, t = d.totals;
    const tile = (n, l, s = '') => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
    const reports = (d.reports || []).slice(0, 30), inbox = (d.inbox || []).slice(0, 30), m = d.mail || {};
    // A report's or a received email's answer: the admin's own mail app, to the user (a report's confirmed address).
    const answer = (to, subject) => `<a href="mailto:${encodeURI(to)}?subject=${encodeURIComponent(subject)}" style="font-size:12.5px;font-weight:700">پاسخ</a>`;
    const short = t => (t.length > 1500 ? `${t.slice(0, 1500)}…` : t);
    $app.innerHTML = `
      <div class="head"><h1 class="grow">داشبورد Teoripro</h1>
        <span class="muted" style="font-size:12.5px">به‌روز: ${when(Date.now())}</span>
        <button class="btn soft" id="re">تازه کردن</button><button class="btn soft" id="out">خروج</button></div>
      <div class="tiles">
        ${tile(fa(t.users), 'کاربران', `${fa(t.newToday)} تازه امروز، ${fa(t.new7)} این هفته`)}
        ${tile(fa(t.activeToday), 'فعال امروز', `${fa(t.active7)} در ۷ روز`)}
        ${tile(fa(t.testsToday), 'آزمون امروز', `${fa(t.tests7)} در ۷ روز، ${fa(t.tests)} کل`)}
        ${tile(t.full ? fa(Math.round(t.passed / t.full * 100)) + '٪' : '–', 'قبولی آزمون کامل', `${fa(t.passed)} از ${fa(t.full)}`)}
        ${tile(t.items30 ? fa(Math.round(t.correct30 / t.items30 * 100)) + '٪' : '–', 'پاسخ درست، ۳۰ روز')}
        ${tile(fa(t.premium), 'نسخه‌ی ویژه', `${fa(t.promo)} با کد تخفیف`)}
        ${tile(fa(Math.round(t.revenue / 100)) + ' kr', 'پرداخت‌ها', `${fa(t.buys)} خرید${t.refunded ? `، ${fa(t.refunded)} برگشتی` : ''}`)}
        ${tile(fa(t.guests), 'مهمان')}
        ${tile(fa(t.unverified), 'ایمیل تأییدنشده')}
        ${tile(fa(t.visitsToday), 'بازدید امروز', `${fa(t.visitorsToday)} بازدیدکننده، ${fa(t.visits7)} در ۷ روز`)}
      </div>
      <div class="card reports news" style="margin-bottom:16px" id="news"><h2>پیام برای همه‌ی کاربران</h2>
        <p class="muted" style="font-size:12.5px;margin:0 0 4px">اطلاعات کلی، به‌روزرسانی‌ها یا راهنمایی‌های تازه. در برنامه پشت دکمه‌ی زنگ صفحه‌ی اصلی نشان داده می‌شود و تا کاربر آن را ندیده، نقطه‌ی قرمزی کنار زنگ است.</p>
        <input id="nt" maxlength="140" placeholder="عنوان">
        <textarea id="nx" maxlength="4000" placeholder="متن پیام"></textarea>
        <label style="display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px"><input type="checkbox" id="nn" checked style="width:auto;margin:0"> اعلان هم فرستاده شود (برای کاربرانی که اعلان را روشن کرده‌اند)</label>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><button class="btn" id="ns">ارسال برای همه</button><span class="muted" id="nm" style="font-size:12.5px"></span></div>
        <div id="nl">${newsList()}</div></div>
      <div class="card reports news" style="margin-bottom:16px" id="rt"><h2>بازنشانی دوره‌ی رایگان</h2>
        <p class="muted" style="font-size:12.5px;margin:0 0 4px">یک ایمیل را دوباره «تازه» می‌کند: دوره‌ی رایگان یک‌روزه و تحلیل رایگان دوباره برایش در دسترس است (حتی اگر حسابش قبلاً حذف شده باشد). فقط برای استثنا یا آزمایش.</p>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input id="rte" placeholder="ایمیل" dir="ltr" style="flex:1;min-width:180px;margin-top:0"><button class="btn" id="rtb">بازنشانی</button></div>
        <div id="rtm" class="muted" style="font-size:13px;margin-top:6px"></div></div>
      <div class="card reports news" style="margin-bottom:16px" id="sm"><h2>ارسال ایمیل (SMTP)</h2>
        <p class="muted" style="font-size:12.5px;margin:0 0 4px">با تنظیم این‌جا همه‌ی ایمیل‌های سایت از این سرور فرستاده می‌شود (مثلاً Oracle Email Delivery)؛ بدون آن از Resend. رمز روی سرور ذخیره می‌شود و این‌جا نشان داده نمی‌شود.</p>
        <div id="sms" class="muted" style="font-size:13px">…</div>
        <input id="smh" placeholder="Host" dir="ltr" value="smtp.email.eu-frankfurt-1.oci.oraclecloud.com">
        <input id="smp" placeholder="Port" dir="ltr" value="587" inputmode="numeric">
        <input id="smu" placeholder="Username" dir="ltr" autocomplete="off">
        <input id="smw" placeholder="Password" dir="ltr" type="password" autocomplete="new-password">
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"><button class="btn" id="smsave">ذخیره</button>
          <input id="smt" placeholder="ایمیل آزمایشی به…" dir="ltr" style="flex:1;min-width:160px;margin-top:0"><button class="btn soft" id="smtest">ارسال آزمایشی</button><button class="btn soft" id="smdel">حذف (بازگشت به Resend)</button></div></div>
      <div class="card reports news" style="margin-bottom:16px" id="pk"><h2>کلید Google Play</h2>
        <p class="muted" style="font-size:12.5px;margin:0 0 4px">فایل JSON کلید service account (برای تأیید خریدهای اپ اندروید). روی سرور ذخیره می‌شود و فقط ایمیل حسابش این‌جا نشان داده می‌شود.</p>
        <div id="pks" class="muted" style="font-size:13px">…</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"><input type="file" id="pkf" accept=".json,application/json" style="width:auto;border:0;padding:0"><button class="btn" id="pku">بارگذاری</button><button class="btn soft" id="pkc">بررسی</button></div></div>
      <div class="row2">
        <div class="card chart"><h2>۳۰ روز اخیر</h2>${chart(d.days)}</div>
        <div class="card"><h2>زبان برنامه</h2>${bars(t.ui, UI)}<h2 style="margin-top:16px">نوع آزمون‌ها</h2>${bars(t.modes, MODE)}</div>
      </div>
      <div class="card" style="margin-bottom:16px"><h2>کاربران</h2><div id="users">${usersTable(d.users)}</div></div>
      <div class="card reports" style="margin-bottom:16px"><h2>گزارش‌ها از برنامه</h2>
        <p class="muted" style="font-size:12.5px;margin:0 0 4px">${m.on ? `هر گزارش به ${esc((m.reportTo || []).join('، '))} هم ایمیل می‌شود.` : 'ایمیل خاموش است (RESEND_API_KEY)؛ گزارش‌ها فقط این‌جا می‌مانند.'}</p>
        ${reports.length ? reports.map(r => `<div class="r">
        <div><span class="tag ${r.kind === 'bug' ? 'expired' : 'trial'}">${r.kind === 'bug' ? 'خطا' : 'پیشنهاد'}</span> <b>${esc(r.name || r.username)}</b> <span class="muted" style="font-size:12px">${when(r.at)} · ${esc(r.platform)} ${esc(r.version)}</span>${r.email ? ` <span class="muted" dir="ltr" style="font-size:12px">${esc(r.email)}</span> ${answer(r.email, 'Teoripro: گزارش شما')}` : ''}</div>
        <div style="white-space:pre-wrap">${esc(r.text)}</div></div>`).join('') : '<p class="muted">گزارشی نیست.</p>'}</div>
      <div class="card reports"><h2>ایمیل‌های دریافتی</h2>
        <p class="muted" style="font-size:12.5px;margin:0 0 4px">${m.inbound ? `ایمیل‌هایی که Resend برای دامنه دریافت کرده${m.forward ? '، که به FORWARD_TO هم فرستاده می‌شوند' : ''}.` : 'برای دیدن ایمیل‌های دریافتی این‌جا: در Resend یک webhook با رویداد email.received به آدرس /api/inbound بسازید و کلید امضایش را در RESEND_WEBHOOK_SECRET بگذارید.'}</p>
        ${inbox.length ? inbox.map(x => `<div class="r">
        <div><b>${esc(x.subject || '(بدون موضوع)')}</b> <span class="muted" style="font-size:12px">${when(x.at)}</span> ${answer((x.replyTo || [])[0] || x.from, `Re: ${x.subject || ''}`)}</div>
        <div class="muted" dir="ltr" style="font-size:12.5px;text-align:right">${esc(x.from)} → ${esc((x.to || []).join(', '))}${(x.replyTo || []).length ? ` · reply-to ${esc(x.replyTo.join(', '))}` : ''}</div>
        <div style="white-space:pre-wrap">${x.text ? esc(short(x.text)) : `<span class="muted">${x.full ? '(بدون متن)' : '(متن خوانده نشد: کلید Resend دسترسی کامل ندارد.)'}</span>`}</div>
        ${(x.attachments || []).length ? `<div class="muted" style="font-size:12px">پیوست: ${x.attachments.map(a => esc(a.name)).join('، ')}</div>` : ''}</div>`).join('') : '<p class="muted">ایمیلی نیست.</p>'}</div>`;
    document.getElementById('re').onclick = view;
    document.getElementById('out').onclick = async () => { await api('POST', 'logout').catch(() => {}); login(); };
    wireUsers();
    wireNews();
    wirePlayKey();
    wireSmtp();
    const rtb = document.getElementById('rtb');
    if (rtb) rtb.onclick = async () => {
      const m = document.getElementById('rtm'), email = document.getElementById('rte').value;
      if (!confirm('دوره‌ی رایگان برای ' + email + ' بازنشانی شود؟')) return;
      try { const d = await api('POST', 'resettrial', { email }); m.textContent = `انجام شد (${d.accounts} حساب${d.records ? '، سابقه‌ی حساب حذف‌شده هم پاک شد' : ''}).`; } catch (e) { m.textContent = e.message; }
    };
  }
  // The SMTP card: its settings (no password), saving them, a test email, back to Resend.
  function wireSmtp() {
    const st = document.getElementById('sms'); if (!st) return;
    const $ = id => document.getElementById(id);
    const show = (d, note) => {
      st.innerHTML = (d.set ? `فعال: <span dir="ltr">${esc(d.user)} @ ${esc(d.host)}:${esc(d.port)}</span>${d.from === 'env' ? ' (از متغیرهای سرور)' : ''}` : `خاموش؛ ایمیل‌ها ${d.resend ? 'با Resend' : 'فرستاده نمی‌شوند'}.`) + (note ? `<br>${esc(note)}` : '');
      if (d.set) { $('smh').value = d.host; $('smp').value = d.port; $('smu').value = d.user; }
    };
    api('GET', 'smtp').then(d => show(d)).catch(e => { st.textContent = e.message; });
    $('smsave').onclick = async () => {
      try { show(await api('POST', 'smtp', { host: $('smh').value, port: $('smp').value, user: $('smu').value, pass: $('smw').value }), 'ذخیره شد. یک ایمیل آزمایشی بفرستید.'); $('smw').value = ''; } catch (e) { st.textContent = e.message; }
    };
    $('smtest').onclick = async () => {
      st.textContent = 'در حال ارسال…';
      try { await api('POST', 'smtptest', { to: $('smt').value }); show(await api('GET', 'smtp'), 'ایمیل آزمایشی فرستاده شد.'); } catch (e) { show(await api('GET', 'smtp').catch(() => ({})), '❌ ' + e.message); }
    };
    $('smdel').onclick = async () => { if (!confirm('تنظیم SMTP حذف شود؟')) return; try { show(await api('DELETE', 'smtp'), 'حذف شد.'); } catch (e) { st.textContent = e.message; } };
  }
  // The Google Play key card: its state, a JSON file sent from this device, a check with Google.
  function wirePlayKey() {
    const st = document.getElementById('pks'); if (!st) return;
    const show = (d, note) => {
      const c = d.check;
      st.innerHTML = (d.set ? `کلید: <span dir="ltr">${esc(d.email)}</span> (${d.from === 'env' ? 'از متغیرهای سرور' : 'بارگذاری‌شده'})` : 'کلیدی نیست؛ خرید در اپ اندروید خاموش است.')
        + (c ? `<br>${c.ok ? `✅ گوگل پاسخ داد. محصولات: <span dir="ltr">${esc((c.products || []).join(', ') || '—')}</span>${(c.missing || []).length ? `<br>⚠️ ساخته نشده: <span dir="ltr">${esc(c.missing.join(', '))}</span>` : ''}` : `❌ ${esc(c.step === 'play' ? 'دسترسی به اپ در Play Console: ' : '')}${esc(c.error || '')}`}` : '')
        + (note ? `<br>${esc(note)}` : '');
    };
    api('GET', 'playkey').then(d => show(d)).catch(e => { st.textContent = e.message; });
    document.getElementById('pku').onclick = async () => {
      const f = document.getElementById('pkf').files[0]; if (!f) { st.textContent = 'اول فایل JSON را انتخاب کنید.'; return; }
      st.textContent = 'در حال بارگذاری…';
      try { show(await api('POST', 'playkey', { key: await f.text() }), 'ذخیره شد.'); document.getElementById('pkf').value = ''; } catch (e) { st.textContent = e.message; }
    };
    document.getElementById('pkc').onclick = async () => { st.textContent = 'در حال بررسی…'; try { show(await api('POST', 'playkeycheck')); } catch (e) { st.textContent = e.message; } };
  }
  function newsList() {
    const n = state.news || [];
    return n.length ? n.map(x => `<div class="r"><div><b>${esc(x.title || '')}</b> <span class="muted" style="font-size:12px">${when(x.at)}</span> <button class="btn soft" data-del="${esc(x.id)}" style="padding:3px 10px;font-size:12px">حذف</button></div>
      ${x.text ? `<div style="white-space:pre-wrap">${esc(x.text)}</div>` : ''}</div>`).join('') : '<p class="muted">پیامی فرستاده نشده است.</p>';
  }
  function wireNews() {
    const box = document.getElementById('news'); if (!box) return;
    const msg = t => { document.getElementById('nm').textContent = t; };
    const refresh = async () => { try { state.news = (await api('GET', 'news')).items; } catch (e) { msg(e.message); } document.getElementById('nl').innerHTML = newsList(); wireNews(); };
    document.getElementById('ns').onclick = async () => {
      const title = document.getElementById('nt').value, text = document.getElementById('nx').value;
      const notify = document.getElementById('nn').checked;
      try { await api('POST', 'news', { title, text, notify }); document.getElementById('nt').value = ''; document.getElementById('nx').value = ''; msg(notify ? 'فرستاده شد؛ اعلان‌ها در حال ارسال است.' : 'فرستاده شد (بدون اعلان).'); refresh(); } catch (e) { msg(e.message); }
    };
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('این پیام حذف شود؟')) return; try { await api('DELETE', 'news?id=' + encodeURIComponent(b.dataset.del)); refresh(); } catch (e) { msg(e.message); } });
  }
  function wireUsers() {
    const box = document.getElementById('users');
    const q = document.getElementById('q');
    q.oninput = () => { state.q = q.value; const pos = q.selectionStart; box.innerHTML = usersTable(state.data.users); wireUsers(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
    box.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { state.filter = b.dataset.f; box.innerHTML = usersTable(state.data.users); wireUsers(); });
    box.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const k = b.dataset.s; state.dir = state.sort === k ? -state.dir : -1; state.sort = k; box.innerHTML = usersTable(state.data.users); wireUsers(); });
    box.querySelectorAll('tr.u').forEach(r => r.onclick = () => { state.open = state.open === r.dataset.u ? null : r.dataset.u; box.innerHTML = usersTable(state.data.users); wireUsers(); });
  }

  async function view() {
    try { state.data = await api('GET', 'adminstats'); state.news = (await api('GET', 'news').catch(() => ({ items: [] }))).items; render(); }
    catch (e) { return login(e.status === 401 || e.status === 403 ? '' : e.message); }
  }
  view();
})();
</script>
</body>
</html>
