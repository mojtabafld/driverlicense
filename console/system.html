<!DOCTYPE html>
<!-- The admin's «سامانه» page at /admin/system (Mojtaba 2026-10-31): the architecture page's picture of the system
     (scratchpad's «معماری تئوری‌پرو»), with the server's live numbers from /api/system: the machine's CPU, memory and
     network and the app's own over 24 hours (monitor.js), the disk, the files bucket and the database, the AI's use
     today and over 14 days (aigateway.js), RAG (rag.js) and the new bank's near-duplicate questions, the backups (backup.js), the version running. Read again
     every minute. In Persian or English (the «English / فارسی» button, kept in this browser). Signed in as an admin
     (the dashboard's sign-in); otherwise back to /admin. -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teoripro · سامانه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f1;--panel:#fff;--panel2:#eef0ec;--line:#d9ddd5;--fg:#17201b;--muted:#5d6a62;--accent:#1f7a52;--accentSoft:#e2f1e8;--ink:#0f2d6b;--inkSoft:#e6ecf8;--c2:#b5651d;--bad:#c0392b;--badSoft:#fbe9e7;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0d110f;--panel:#151b18;--panel2:#1c2420;--line:#2a342f;--fg:#eef3ef;--muted:#9aa89f;--accent:#4cc38a;--accentSoft:#173226;--ink:#9db7ff;--inkSoft:#141d33;--c2:#f0a35e;--bad:#ef7b6b;--badSoft:#3a1f1c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Vazirmatn',Tahoma,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:800;margin:0;flex:1}
.btn{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;padding:7px 14px;background:var(--panel2);color:var(--fg);cursor:pointer;text-decoration:none}
.lead{color:var(--muted);margin:0}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;border-radius:999px;padding:3px 12px;background:var(--panel2);color:var(--muted)}
.pill.ok{background:var(--accentSoft);color:var(--accent);font-weight:700}
.pill.bad{background:var(--badSoft);color:var(--bad);font-weight:700}
.num{font-family:var(--mono);font-size:13px;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:center}
.box h3{margin:0;font-size:17px}
.box p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.users{background:var(--accentSoft);border-color:transparent}
.arrow{text-align:center;color:var(--muted);font-size:18px;line-height:1}
.server{border:1.5px solid var(--accent);border-radius:16px;padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:12px}
.server header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.server header h2{margin:0;font-size:18px}
.chip{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accentSoft);border-radius:999px;padding:3px 10px}
.grid,.two,.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--panel2);border-radius:12px;padding:12px 14px;min-width:0}
.cell h4{margin:0;font-size:15px}
.cell p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ai{background:var(--inkSoft);border-color:transparent}.ai h3{color:var(--ink)}
.ops .box{text-align:start}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accentSoft);border-radius:6px;padding:1px 8px;margin-bottom:4px}
h2.sec{font-size:17px;margin:16px 0 0}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mhead h3{margin:0;font-size:15.5px}
.mstat{font-size:12.5px;color:var(--muted)}
.mstat b{font-family:var(--mono);font-weight:500;color:var(--fg);font-size:13px;direction:ltr;unicode-bidi:isolate}
.chart{direction:ltr;width:100%;height:120px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-inline-end:6px;vertical-align:middle}
.wide{grid-column:1/-1}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.bar .row span:last-child{font-family:var(--mono);font-size:12.5px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--mono);font-size:19px;font-weight:500;color:var(--accent);direction:ltr;unicode-bidi:isolate;text-align:start}
.kpi span{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12.5px}
.tblw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.note{color:var(--muted);font-size:12.5px;margin:0}
.models{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:start}
.mt{background:var(--panel);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mt .t{font-size:13.5px;font-weight:700;color:var(--fg)}
.fam{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-family:var(--mono);font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;direction:ltr;background:var(--panel2);color:var(--muted)}
.fam i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.fam.haiku{background:var(--accentSoft);color:var(--accent)}
.fam.sonnet{background:var(--inkSoft);color:var(--ink)}
.fam.opus{background:color-mix(in srgb,var(--c2) 16%,var(--panel));color:var(--c2)}
.fam.fable{background:var(--badSoft);color:var(--bad)}
.src{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.src b{font-weight:700;border-radius:5px;padding:0 6px;background:var(--panel2)}
.src b.vault{background:var(--inkSoft);color:var(--ink)}
.src .num{font-size:11px}
.msum{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.mt{font:inherit;border:1px solid transparent;cursor:pointer;text-align:start;transition:border-color .15s,transform .15s}
.mt:hover{border-color:var(--ink)}.mt:active{transform:scale(.98)}.mt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
dialog.mi{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--panel);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.mi::backdrop{background:rgba(10,14,12,.55)}
.mi .mh{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.mi .mh h3{margin:0;font-size:18px;flex:1}
.mi .x{font:inherit;font-size:20px;line-height:1;border:0;background:var(--panel2);color:var(--fg);width:34px;height:34px;border-radius:50%;cursor:pointer;flex:none}
.mi .mb{padding:14px 18px 20px;display:flex;flex-direction:column;gap:14px}
.mi h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:700}
.mi p{margin:0;font-size:14px}
.mi ul{margin:0;padding-inline-start:20px;font-size:14px}
.mi li{margin:2px 0}
.mi .prio{display:flex;flex-direction:column;gap:6px}
.mi .pr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:10px;padding:7px 10px;background:var(--panel2);font-size:13px;color:var(--muted)}
.mi .pr.on{background:var(--inkSoft);color:var(--fg);font-weight:600}
.mi .pr .n{font-family:var(--mono);font-size:12px;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);flex:none}
.mi .pr .w{margin-inline-start:auto;font-size:11.5px;color:var(--ink)}
.mi code{font-family:var(--mono);font-size:12.5px;direction:ltr;unicode-bidi:isolate;background:var(--panel2);border-radius:5px;padding:1px 6px}
@media (max-width:620px){.grid,.two,.ops{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.models{grid-template-columns:1fr 1fr}}
@media (max-width:380px){.models{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"><p class="lead">در حال بارگذاری…</p></main>
<script>
(() => {
  const $app = document.getElementById('app');
  // The language (Mojtaba 2026-10-31): Persian or English, the «English / فارسی» button; kept in this browser.
  let lang = 'fa';
  try { if (localStorage.getItem('sysLang') === 'en') lang = 'en'; } catch {}
  const L = (f, e) => (lang === 'en' ? e : f);
  function setLang() {
    document.documentElement.lang = lang; document.documentElement.dir = L('rtl', 'ltr');
    document.title = `Teoripro · ${L('سامانه', 'System')}`;
  }
  setLang();
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fa = n => Number(n).toLocaleString(L('fa-IR', 'en-US'));
  const mb = b => b == null ? '–' : b >= 1e9 ? `${(b / 1e9).toFixed(1)} GB` : `${(b / 1e6).toFixed(1)} MB`;
  const pct = (a, b) => (a && b ? Math.round(a / b * 1000) / 10 : 0);
  const usd = v => `$${(+v || 0).toFixed((+v || 0) < 1 ? 3 : 2)}`;
  const hhmm = t => new Date(t).toLocaleTimeString('en-GB', { timeZone: 'Europe/Copenhagen', hour: '2-digit', minute: '2-digit' });
  const dur = s => s < 3600 ? `${fa(Math.round(s / 60))} ${L('دقیقه', 'min')}` : s < 86400 ? `${fa(Math.round(s / 3600))} ${L('ساعت', 'h')}` : `${fa(Math.round(s / 86400))} ${L('روز', 'days')}`;
  async function api(route) {
    const r = await fetch('/api/' + route, { credentials: 'same-origin' });
    if (r.status === 401 || r.status === 403) { location.href = '/admin'; throw new Error('sign in'); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || L('خطا', 'Error'));
    return d;
  }

  // A line chart of one or two series ([{ data: [[t, v]], color }]), its scale from 0 to a round top.
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const nice = m => [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000, 2000, 5000, 10000].find(x => m <= x) || Math.ceil(m / 1e4) * 1e4;
  function draw(box, series, unit, fixedTop) {
    const W = box.clientWidth || 320, H = box.clientHeight || 120, L0 = 40, R = 6, T = 6, B = 18;
    const n = series[0].data.length;
    if (n < 2) { box.innerHTML = `<p class="note" style="text-align:center;padding-top:40px">${L('داده‌ی کافی هنوز جمع نشده؛ سرور هر دقیقه یک نمونه ثبت می‌کند.', 'Not enough data yet; the server records a sample every minute.')}</p>`; return; }
    const max = fixedTop || nice(Math.max(1, ...series.flatMap(s => s.data.map(p => p[1]))));
    const t0 = series[0].data[0][0], t1 = series[0].data[n - 1][0];
    const x = t => L0 + (W - L0 - R) * (t - t0) / Math.max(1, t1 - t0), y = v => T + (H - T - B) * (1 - Math.min(v, max) / max);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });
    [0, max / 2, max].forEach(v => {
      svg.appendChild(el('line', { x1: L0, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--line)', 'stroke-dasharray': v ? '3 4' : '' }));
      const t = el('text', { x: L0 - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 10.5, fill: 'var(--muted)', 'font-family': 'JetBrains Mono, monospace' });
      t.textContent = unit === 'k' ? (v >= 1000 ? `${v / 1000}M` : `${v}k`) : `${v}${unit}`; svg.appendChild(t);
    });
    for (let i = 0; i < 5; i++) {
      const tt = t0 + (t1 - t0) * i / 4, t = el('text', { x: x(tt), y: H - 4, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle', 'font-size': 10.5, fill: 'var(--muted)', 'font-family': 'JetBrains Mono, monospace' });
      t.textContent = hhmm(tt); svg.appendChild(t);
    }
    series.forEach((s, k) => {
      const d = s.data.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
      if (k === 0) svg.appendChild(el('path', { d: `${d} L${x(t1)},${y(0)} L${x(t0)},${y(0)} Z`, fill: s.color, 'fill-opacity': 0.14 }));
      svg.appendChild(el('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 1.6, 'stroke-linejoin': 'round' }));
    });
    box.innerHTML = ''; box.appendChild(svg);
  }
  const stat = arr => arr.length ? { avg: arr.reduce((a, b) => a + b, 0) / arr.length, max: Math.max(...arr), last: arr[arr.length - 1] } : { avg: 0, max: 0, last: 0 };
  const f1 = v => (Math.round(v * 10) / 10).toString();
  const meter = (label, used, total, text) => `<div class="bar"><div class="row"><span>${label}</span><span>${text} · ${pct(used, total)}%</span></div><div class="meter"><i style="width:${Math.max(0.5, Math.min(100, pct(used, total)))}%"></i></div></div>`;

  // «آزمون جدید»'s questions that say nearly the same (rag.js duplicates; /api/ragdupes), asked for once with the page.
  let DUP = null;
  // The admins' log (audit.js): sign-ins with admin rights, the changes made with them, and refused requests.
  function auditHtml(list) {
    if (!list || !list.length) return `<p class="note">${L('هنوز چیزی ثبت نشده است.', 'Nothing recorded yet.')}</p>`;
    const when = t => new Date(t).toLocaleString('en-GB', { timeZone: 'Europe/Copenhagen', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    const what = x => x.act === 'signin' ? L('ورود مدیر', 'Admin sign-in') : x.act === 'signin-failed' ? L('کد نادرست برای ورود مدیر', 'Wrong admin sign-in code')
      : x.act.startsWith('denied:') ? L('رد شد: ', 'Refused: ') + x.act.slice(7) : `${x.m || ''} ${x.act}`;
    const bad = x => x.act === 'signin-failed' || x.act.startsWith('denied:') || (x.code && x.code >= 400);
    const det = x => x.d ? Object.entries(x.d).map(([k, v]) => `${k}: ${v}`).join(' · ') : '';
    return `<div class="tblw" style="border:0;padding:0"><table><thead><tr><th>${L('زمان', 'When')}</th><th>${L('مدیر', 'Admin')}</th><th>${L('کار', 'Action')}</th><th>${L('جزئیات', 'Details')}</th><th>${L('از', 'From')}</th></tr></thead><tbody>
      ${list.slice(0, 100).map(x => `<tr${bad(x) ? ' style="color:#c0392b"' : ''}><td class="num">${esc(when(x.at))}</td><td dir="ltr">${esc(x.by)}</td><td dir="auto">${esc(what(x))}${x.code ? ` <span class="num">(${x.code})</span>` : ''}${x.n > 1 ? ` <span class="num">×${x.n}</span>` : ''}</td><td dir="auto">${esc(det(x))}</td><td dir="ltr"><span class="num">${esc(x.ip || '')}</span> ${esc(x.dev || '')}</td></tr>`).join('')}
      </tbody></table></div>`;
  }

  // Play Integrity (integrity.js): the Android devices checked in 30 days, by Google Play's verdict.
  function piHtml(pi) {
    if (!pi || !pi.on) return `<p class="note">${L('خاموش است: PLAY_INTEGRITY_PROJECT (شماره‌ی پروژه‌ی Google Cloud) تنظیم نشده.', 'Off: PLAY_INTEGRITY_PROJECT (the Google Cloud project number) is not set.')}</p>`;
    if (!pi.devices) return `<p class="note">${L('هنوز هیچ دستگاهی بررسی نشده است.', 'No device checked yet.')}</p>`;
    const row = o => Object.entries(o).map(([k, v]) => `<span class="pill${/PLAY_RECOGNIZED|STRONG|DEVICE/.test(k) ? ' ok' : ' bad'}">${esc(k)} · <span class="num">${fa(v)}</span></span>`).join(' ');
    return `<div class="mhead"><h3>${L(`${fa(pi.ok)} از ${fa(pi.devices)} دستگاه سالم`, `${fa(pi.ok)} of ${fa(pi.devices)} devices pass`)}</h3><span class="mstat">${L('۳۰ روز اخیر · فقط ثبت، بدون مسدودسازی', 'last 30 days · recorded only, nothing blocked')}</span></div>
      <p>${L('اپ', 'App')}: ${row(pi.app)}</p><p>${L('دستگاه', 'Device')}: ${row(pi.device)}</p>`;
  }

  function dupesHtml() {
    if (!DUP) return `<p class="note">${L('در حال بررسی…', 'Checking…')}</p>`;
    if (DUP.pending) return `<p class="note">${L('بردارهای معنایی سؤال‌ها هنوز آماده نیست.', "The questions' meaning vectors are not ready yet.")}</p>`;
    if (!DUP.list.length) return `<p class="note">${L('هیچ دو سؤالی تقریباً یکسان نیستند.', 'No two questions are nearly the same.')}</p>`;
    return `<div class="mhead"><h3>${L(`${fa(DUP.total)} جفت با شباهت ۹۳٪ یا بیشتر`, `${fa(DUP.total)} pairs at 93% similarity or more`)}</h3><span class="mstat">${L('شبیه‌ترین‌ها اول', 'closest first')}</span></div>
      <div class="tblw" style="border:0;padding:0"><table><thead><tr><th>${L('شباهت', 'Similarity')}</th><th>${L('سؤال', 'Question')}</th><th>${L('سؤال مشابه', 'Similar question')}</th></tr></thead><tbody>
      ${DUP.list.slice(0, 25).map(x => `<tr><td class="num">${Math.round(x.s * 100)}%</td><td><span class="num">#${x.a}</span> <span dir="auto">${esc(x.ta)}</span></td><td><span class="num">#${x.b}</span> <span dir="auto">${esc(x.tb)}</span></td></tr>`).join('')}
      </tbody></table></div>${DUP.list.length > 25 ? `<p class="note">${L(`و ${fa(DUP.list.length - 25)} جفت دیگر.`, `and ${fa(DUP.list.length - 25)} more pairs.`)}</p>` : ''}`;
  }

  // The model each AI task really runs on and where that comes from (aigateway.js effective(); Mojtaba 2026-11-11):
  // a count per model under the gateway's numbers, then one tile per task with its model and its source.
  const TASK = {
    coach: ['مربی شخصی', 'Personal coach'], lesson: ['درس هوشمند', 'AI lessons'], search: ['جستجو', 'Search'], ask: ['بپرس', 'Ask'],
    'search-term': ['صفحه‌ی اصطلاح', 'Term page'], insights: ['گزارش روزانه‌ی ادمین', "Admin's daily report"],
    'picture-describe': ['توصیف تصویر', 'Picture description'], 'picture-check': ['بررسی تصویر', 'Picture check'], 'picture-prompt': ['پرامپت تصویر', 'Picture prompt'],
  };
  const family = id => (/(haiku|sonnet|opus|fable|mythos)/.exec(id) || [, ''])[1].replace('mythos', 'fable');
  const pretty = id => { const m = /^claude-([a-z]+)-(\d+)(?:-(\d+))?/.exec(id || ''); return m ? `${m[1][0].toUpperCase()}${m[1].slice(1)} ${m[2]}${m[3] ? '.' + m[3] : ''}` : (id || '–'); };
  const pill = id => `<span class="fam ${family(id)}" title="${esc(id)}"><i></i>${esc(pretty(id))}</span>`;
  function models(list) {
    if (!list.length) return '';
    const count = {};
    for (const x of list) count[x.model] = (count[x.model] || 0) + 1;
    const from = x => x.from === 'vault' ? `<b class="vault">vault</b>` : x.from === 'env' ? `<b>${L('فایل env', 'env file')}</b>` : `<b>${L('پیش‌فرض کد', 'code default')}</b>`;

        <div class="mcard"><div class="mhead"><h3>${L('حافظه', 'Memory')}</h3><span class="mstat">${L('الان', 'now')} <b>${f1(mem.last)}%</b> · ${L('بیشینه', 'max')} <b>${f1(mem.max)}%</b> ${L('از', 'of')} <b>${mb(host.memory)}</b></span></div>
          <div class="chart" data-c="mem"></div></div>
        <div class="mcard wide"><div class="mhead"><h3>${L('شبکه', 'Network')}</h3><span class="mstat">${L('دریافت', 'In')}: ${L('میانگین', 'avg')} <b>${f1(rx.avg)} kB/s</b> · ${L('بیشینه', 'max')} <b>${f1(rx.max)} kB/s</b> · ${L('ارسال', 'Out')}: ${L('میانگین', 'avg')} <b>${f1(tx.avg)} kB/s</b></span></div>
          <div class="chart" data-c="net"></div><div class="legend"><span><i style="background:var(--accent)"></i>${L('دریافت', 'In')}</span><span><i style="background:var(--c2)"></i>${L('ارسال', 'Out')}</span></div></div>
        <div class="mcard wide"><div class="mhead"><h3>${L('فضای ذخیره', 'Storage')}</h3><span class="mstat">${s.at ? L('اندازه‌گیری', 'Measured') + ' ' + esc(hhmm(s.at)) : ''}</span></div>
          <div class="bars">
            ${s.disk ? meter(L('دیسک سرور', 'Server disk'), s.disk.used, s.disk.total, `${mb(s.disk.used)} / ${mb(s.disk.total)}`) : ''}
            ${s.bucket ? meter('Object Storage', s.bucket.bytes, 20e9, `${mb(s.bucket.bytes)} / 20 GB`) : ''}
            ${s.db ? meter('Autonomous Database', s.db, 20e9, `${mb(s.db)} / 20 GB`) : ''}
          </div></div>
      </div>

      <h2 class="sec">${L('هوش مصنوعی', 'AI')}</h2>
      <div class="two">
        <div class="mcard"><div class="mhead"><h3>${L('امروز به تفکیک بخش', 'Today by part')}</h3><span class="mstat"><b>${usd(today.usd)}</b></span></div>
          ${Object.keys(today.tasks).length ? `<table>${Object.entries(today.tasks).sort((a, b) => b[1].usd - a[1].usd).map(([k, x]) => `<tr><td>${esc(k)}</td><td>${fa(x.n)}${x.fail ? ` (${fa(x.fail)} ✕)` : ''}</td><td class="num">${x.in || x.out ? usd(x.usd) : '—'}</td></tr>`).join('')}</table>` : `<p class="note">${L('امروز هنوز درخواستی نبوده است.', 'No requests yet today.')}</p>`}</div>
        <div class="mcard"><div class="mhead"><h3>${L('۱۴ روز اخیر', 'Last 14 days')}</h3><span class="mstat">${L('جمع', 'Total')} <b>${usd((ai.days || []).reduce((a, x) => a + x.usd, 0))}</b></span></div>
          <div style="display:flex;align-items:flex-end;gap:3px;height:90px;direction:ltr">${(ai.days || []).map(x => { const mx = Math.max(0.0001, ...(ai.days || []).map(y => y.usd)); return `<div title="${esc(x.day)}: ${usd(x.usd)}" style="flex:1;min-width:4px;height:${Math.max(2, Math.round(x.usd / mx * 86))}px;background:var(--accent);border-radius:3px 3px 0 0;opacity:.85"></div>`; }).join('') || `<p class="note">${L('داده‌ای نیست.', 'No data.')}</p>`}</div></div>
        <div class="mcard"><div class="mhead"><h3>${L('RAG (جستجوی معنایی)', 'RAG (semantic search)')}</h3><span class="pill ${ragQ ? 'ok' : ''}">${ragQ ? L('فعال', 'Active') : L('در حال آماده شدن', 'Getting ready')}</span></div>
          <p class="note">${fa(rag.questions || 0)} ${L('سؤال', 'questions')} · ${fa(rag.vectors || 0)} ${L('بردار', 'vectors')} ${rag.persisted ? L('در ستون VECTOR اوراکل', "in Oracle's VECTOR column") : L('در حافظه', 'in memory')} · ${L('مدل', 'model')} <span class="num">${esc(rag.model || '–')}</span></p>
          <p class="note">${ragCat ? L('فهرست درس‌ها: بارگذاری‌شده', 'Lessons catalogue: loaded') : L('فهرست درس‌ها: با اولین جستجوی هوشمند از اپ بارگذاری می‌شود (بعد از هر راه‌اندازی دوباره).', 'Lessons catalogue: loaded with the first AI search from the app (after each restart).')}</p></div>
        <div class="mcard"><div class="mhead"><h3>${L('پشتیبان‌ها', 'Backups')}</h3><span class="mstat">${fa((d.backups || []).length)} ${L('نسخه', 'copies')}</span></div>
          ${(d.backups || []).length ? `<table>${d.backups.slice(0, 5).map(b => `<tr><td class="num">${esc(b.name)}</td><td class="num">${(b.size / 1e3).toFixed(0)} kB</td></tr>`).join('')}</table>` : `<p class="note">${L('هنوز پشتیبانی نیست.', 'No backups yet.')}</p>`}</div>
      </div>

      <h2 class="sec">${L('سؤال‌های تکراری در بانک «آزمون جدید»', 'Near-duplicate questions in the new bank')}</h2>
      <div class="mcard">${dupesHtml()}</div>

      <h2 class="sec">${L('امنیت و نگهداری', 'Security and upkeep')}</h2>
      <div class="ops">
        <div class="box"><span class="tag">${L('کلیدها', 'Keys')}</span><h3>Oracle Vault</h3><p>${L('هر کلید یک secret جدا · فقط همین فهرست خوانده می‌شود · سرور فقط اجازه‌ی خواندن دارد', 'One secret per key · only this list is read · the server can only read')}</p></div>
        <div class="box"><span class="tag">${L('پشتیبان', 'Backup')}</span><h3>${L('پشتیبان شبانه', 'Nightly backup')}</h3><p>${L('هر شب بعد از ساعت ۳ در Object Storage · ۱۴ نسخه‌ی آخر', 'Every night after 3:00 to Object Storage · the last 14 kept')}</p></div>
        <div class="box"><span class="tag">${L('پایش', 'Monitoring')}</span><h3>${L('هشدارها', 'Alerts')}</h3><p>${L('گیت‌هاب هر ۱۵ دقیقه سایت را بررسی می‌کند · اوراکل برای حافظه، پردازنده و قطعی ایمیل می‌فرستد', 'GitHub checks the site every 15 minutes · Oracle emails on memory, CPU and outages')}</p></div>
        <div class="box"><span class="tag">${L('انتشار', 'Release')}</span><h3>${L('CI/CD با GitHub', 'CI/CD with GitHub')}</h3><p>${L('هر تغییر پیش از ادغام آزمایش می‌شود · نسخه‌ای که بالا نیاید خودکار برمی‌گردد', 'Every change is tested before merging · a version that does not start is rolled back')}</p></div>
      </div>

      <div class="pills"><span class="pill ${d.encryption && d.encryption.on ? 'ok' : 'bad'}">${L('رمزگذاری داده‌های پایگاه داده', 'Database data encryption')}: ${d.encryption ? (d.encryption.on ? L('روشن', 'on') : d.encryption.key ? L('در حال شروع', 'starting') : L('خاموش (DATA_KEY تنظیم نشده)', 'off (DATA_KEY not set)')) : '–'}</span></div>

      <h2 class="sec">Play Integrity</h2>
      <div class="mcard">${piHtml(d.integrity)}</div>

      <h2 class="sec">${L('گزارش کارهای مدیر', "Admins' log")}</h2>
      <div class="mcard">${auditHtml(d.audit)}</div>

      <h2 class="sec">${L('آزمون ظرفیت: ۱۰۰۰ کاربر همزمان (۳۱ اکتبر)', 'Capacity test: 1,000 concurrent users (31 October)')}</h2>
      <div class="kpis">
        <div class="kpi"><b>0%</b><span>${L('خطا', 'errors')}</span></div>
        <div class="kpi"><b>128,632</b><span>${L('درخواست · حدود ۳۵۰ در ثانیه', 'requests · about 350 a second')}</span></div>
        <div class="kpi"><b>129–185 ms</b><span>${L('زمان پاسخ ۹۵٪', '95th percentile response')}</span></div>
        <div class="kpi"><b>220 MB</b><span>${L('بیشینه‌ی حافظه‌ی برنامه', "the app's peak memory")}</span></div>
      </div>

      <h2 class="sec">${L('تصمیم‌های معماری', 'Architecture decisions')}</h2>
      <div class="ops">
        <div class="box"><span class="tag">RAG</span><h3>${L('جستجوی معنایی', 'Semantic search')}</h3><p>${L('برای هر جستجو فقط ۲۰ بخش مرتبط و ۶ سؤال به Claude می‌رود، نه کل فهرست', 'Each search sends Claude only the 20 closest entries and 6 questions, not the whole catalogue')}</p></div>
        <div class="box"><span class="tag">Redis</span><h3>${L('فعلاً لازم نیست', 'Not needed yet')}</h3><p>${L('با سرور دوم یا مصرف پایدار بالای ۷۰٪ یک هسته دوباره بررسی می‌شود', 'Revisited with a second server or sustained use above 70% of a core')}</p></div>
        <div class="box wide"><span class="tag">NestJS</span><h3>${L('بازنویسی نمی‌شود', 'No rewrite')}</h3><p>${L('همه‌ی قابلیت‌ها روی همین سرور Node.js ساخته شد و آزمون ظرفیت گلوگاهی نشان نداد', 'Everything was built on the existing Node.js server, and the capacity test showed no bottleneck')}</p></div>
      </div>

      <h2 class="sec">${L('چه چیزی کجا ذخیره می‌شود', 'What is stored where')}</h2>
      <div class="tblw"><table>
        <thead><tr><th>${L('داده', 'Data')}</th><th>${L('محل', 'Where')}</th></tr></thead>
        <tbody>
          <tr><td>${L('حساب‌ها، آزمون‌ها، نشان‌شده‌ها، تنظیمات', 'Accounts, tests, bookmarks, settings')}</td><td>Autonomous Database</td></tr>
          <tr><td>${L('فهرست تصاویر، تصمیم‌های ادمین، اخبار، آمار سرور', "Picture list, the admin's decisions, news, server stats")}</td><td>Autonomous Database</td></tr>
          <tr><td>${L('بردارهای معنایی جستجو (RAG)، مصرف هوش مصنوعی', 'Search meaning vectors (RAG), AI usage')}</td><td>Autonomous Database</td></tr>
          <tr><td>${L('تصاویر و نسخه‌های پشتیبان', 'Pictures and backups')}</td><td>Object Storage</td></tr>
          <tr><td>${L('کلیدها و رمزها', 'Keys and passwords')}</td><td>Oracle Vault</td></tr>
          <tr><td>${L('سؤال‌ها و متن درس‌ها', 'Questions and lesson texts')}</td><td>${L('کد برنامه در GitHub', 'The app code on GitHub')}</td></tr>
        </tbody>
      </table></div>`;
    const series = k => pts.filter(p => p[k] != null).map(p => [p.t, p[k]]);
    const C = { cpu: () => [[{ data: series('cpu'), color: 'var(--accent)' }, { data: series('app').map(([t, v]) => [t, v / (host.cpus || 2)]), color: 'var(--c2)' }], '%', 100],
      mem: () => [[{ data: series('mem'), color: 'var(--accent)' }], '%', 100], net: () => [[{ data: series('rx'), color: 'var(--accent)' }, { data: series('tx'), color: 'var(--c2)' }], 'k'] };
    document.querySelectorAll('[data-c]').forEach(b => { const [s2, u, top] = C[b.dataset.c](); draw(b, s2, u, top); });
    document.getElementById('re').onclick = load;
    document.getElementById('lg').onclick = () => {
      lang = lang === 'en' ? 'fa' : 'en';
      try { localStorage.setItem('sysLang', lang); } catch {}
      setLang(); render();
    };
  }
  async function load() {
    try {
      D = await api('system'); render();
      if (!DUP || DUP.pending) api('ragdupes').then(x => { DUP = x; render(); }).catch(() => {});
    }
    catch (e) { if (e.message !== 'sign in') $app.innerHTML = `<p class="lead">${L('خطا', 'Error')}: ${esc(e.message)}</p>`; }
  }
  load();
  setInterval(() => { if (!document.hidden) load(); }, 60e3);
  window.addEventListener('resize', () => { if (D) render(); });
})();
</script>
</body>
</html>
