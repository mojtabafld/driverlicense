<!DOCTYPE html>
<!-- The admin's «سامانه» page at /admin/system (Mojtaba 2026-10-31): the architecture page's picture of the system
     (scratchpad's «معماری تئوری‌پرو»), with the server's live numbers from /api/system: the machine's CPU, memory and
     network and the app's own over 24 hours (monitor.js), the disk, the files bucket and the database, the AI's use
     today and over 14 days (aigateway.js), RAG (rag.js), the backups (backup.js), the version running. Read again
     every minute. Signed in as an admin (the dashboard's sign-in); otherwise back to /admin. -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teoripro · سامانه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f1;--panel:#fff;--panel2:#eef0ec;--line:#d9ddd5;--fg:#17201b;--muted:#5d6a62;--accent:#1f7a52;--accentSoft:#e2f1e8;--ink:#0f2d6b;--inkSoft:#e6ecf8;--c2:#b5651d;--bad:#c0392b;--badSoft:#fbe9e7;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0d110f;--panel:#151b18;--panel2:#1c2420;--line:#2a342f;--fg:#eef3ef;--muted:#9aa89f;--accent:#4cc38a;--accentSoft:#173226;--ink:#9db7ff;--inkSoft:#141d33;--c2:#f0a35e;--bad:#ef7b6b;--badSoft:#3a1f1c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Vazirmatn',Tahoma,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:800;margin:0;flex:1}
.btn{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;padding:7px 14px;background:var(--panel2);color:var(--fg);cursor:pointer;text-decoration:none}
.lead{color:var(--muted);margin:0}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;border-radius:999px;padding:3px 12px;background:var(--panel2);color:var(--muted)}
.pill.ok{background:var(--accentSoft);color:var(--accent);font-weight:700}
.pill.bad{background:var(--badSoft);color:var(--bad);font-weight:700}
.num{font-family:var(--mono);font-size:13px;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:center}
.box h3{margin:0;font-size:17px}
.box p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.users{background:var(--accentSoft);border-color:transparent}
.arrow{text-align:center;color:var(--muted);font-size:18px;line-height:1}
.server{border:1.5px solid var(--accent);border-radius:16px;padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:12px}
.server header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.server header h2{margin:0;font-size:18px}
.chip{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accentSoft);border-radius:999px;padding:3px 10px}
.grid,.two,.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--panel2);border-radius:12px;padding:12px 14px;min-width:0}
.cell h4{margin:0;font-size:15px}
.cell p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ai{background:var(--inkSoft);border-color:transparent}.ai h3{color:var(--ink)}
.ops .box{text-align:start}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accentSoft);border-radius:6px;padding:1px 8px;margin-bottom:4px}
h2.sec{font-size:17px;margin:16px 0 0}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mhead h3{margin:0;font-size:15.5px}
.mstat{font-size:12.5px;color:var(--muted)}
.mstat b{font-family:var(--mono);font-weight:500;color:var(--fg);font-size:13px;direction:ltr;unicode-bidi:isolate}
.chart{direction:ltr;width:100%;height:120px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-inline-end:6px;vertical-align:middle}
.wide{grid-column:1/-1}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.bar .row span:last-child{font-family:var(--mono);font-size:12.5px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--mono);font-size:19px;font-weight:500;color:var(--accent);direction:ltr;unicode-bidi:isolate;text-align:start}
.kpi span{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12.5px}
.tblw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.note{color:var(--muted);font-size:12.5px;margin:0}
@media (max-width:620px){.grid,.two,.ops{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main id="app"><p class="lead">در حال بارگذاری…</p></main>
<script>
(() => {
  const $app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fa = n => Number(n).toLocaleString('fa-IR');
  const mb = b => b == null ? '–' : b >= 1e9 ? `${(b / 1e9).toFixed(1)} GB` : `${(b / 1e6).toFixed(1)} MB`;
  const pct = (a, b) => (a && b ? Math.round(a / b * 1000) / 10 : 0);
  const usd = v => `$${(+v || 0).toFixed((+v || 0) < 1 ? 3 : 2)}`;
  const hhmm = t => new Date(t).toLocaleTimeString('en-GB', { timeZone: 'Europe/Copenhagen', hour: '2-digit', minute: '2-digit' });
  const dur = s => s < 3600 ? `${fa(Math.round(s / 60))} دقیقه` : s < 86400 ? `${fa(Math.round(s / 3600))} ساعت` : `${fa(Math.round(s / 86400))} روز`;
  async function api(route) {
    const r = await fetch('/api/' + route, { credentials: 'same-origin' });
    if (r.status === 401 || r.status === 403) { location.href = '/admin'; throw new Error('sign in'); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'خطا');
    return d;
  }

  // A line chart of one or two series ([{ data: [[t, v]], color }]), its scale from 0 to a round top.
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const nice = m => [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000, 2000, 5000, 10000].find(x => m <= x) || Math.ceil(m / 1e4) * 1e4;
  function draw(box, series, unit, fixedTop) {
    const W = box.clientWidth || 320, H = box.clientHeight || 120, L = 40, R = 6, T = 6, B = 18;
    const n = series[0].data.length;
    if (n < 2) { box.innerHTML = '<p class="note" style="text-align:center;padding-top:40px">داده‌ی کافی هنوز جمع نشده؛ سرور هر دقیقه یک نمونه ثبت می‌کند.</p>'; return; }
    const max = fixedTop || nice(Math.max(1, ...series.flatMap(s => s.data.map(p => p[1]))));
    const t0 = series[0].data[0][0], t1 = series[0].data[n - 1][0];
    const x = t => L + (W - L - R) * (t - t0) / Math.max(1, t1 - t0), y = v => T + (H - T - B) * (1 - Math.min(v, max) / max);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });
    [0, max / 2, max].forEach(v => {
      svg.appendChild(el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--line)', 'stroke-dasharray': v ? '3 4' : '' }));
      const t = el('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 10.5, fill: 'var(--muted)', 'font-family': 'JetBrains Mono, monospace' });
      t.textContent = unit === 'k' ? (v >= 1000 ? `${v / 1000}M` : `${v}k`) : `${v}${unit}`; svg.appendChild(t);
    });
    for (let i = 0; i < 5; i++) {
      const tt = t0 + (t1 - t0) * i / 4, t = el('text', { x: x(tt), y: H - 4, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle', 'font-size': 10.5, fill: 'var(--muted)', 'font-family': 'JetBrains Mono, monospace' });
      t.textContent = hhmm(tt); svg.appendChild(t);
    }
    series.forEach((s, k) => {
      const d = s.data.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
      if (k === 0) svg.appendChild(el('path', { d: `${d} L${x(t1)},${y(0)} L${x(t0)},${y(0)} Z`, fill: s.color, 'fill-opacity': 0.14 }));
      svg.appendChild(el('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 1.6, 'stroke-linejoin': 'round' }));
    });
    box.innerHTML = ''; box.appendChild(svg);
  }
  const stat = arr => arr.length ? { avg: arr.reduce((a, b) => a + b, 0) / arr.length, max: Math.max(...arr), last: arr[arr.length - 1] } : { avg: 0, max: 0, last: 0 };
  const f1 = v => (Math.round(v * 10) / 10).toString();
  const meter = (label, used, total, text) => `<div class="bar"><div class="row"><span>${label}</span><span>${text} · ${pct(used, total)}%</span></div><div class="meter"><i style="width:${Math.max(0.5, Math.min(100, pct(used, total)))}%"></i></div></div>`;

  let D = null;
  function render() {
    const d = D, m = d.monitor, pts = m.points || [], s = m.sizes || {}, host = m.host || {};
    const cpu = stat(pts.map(p => p.cpu || 0)), app = stat(pts.map(p => p.app || 0)), mem = stat(pts.map(p => p.mem || 0)), rx = stat(pts.map(p => p.rx || 0)), tx = stat(pts.map(p => p.tx || 0));
    const rss = pts.length ? pts[pts.length - 1].rss : null, ai = d.ai || {}, today = ai.today || { tasks: {} }, rag = d.rag || {};
    const ragReady = (rag.catalogs || []).some(c => c.ready);
    $app.innerHTML = `
      <div class="top"><h1>سامانه</h1><a class="btn" href="/admin">داشبورد</a><a class="btn" href="/admin/images">ایجاد تصاویر</a><button class="btn" id="re">تازه کردن</button></div>
      <p class="lead">معماری تئوری‌پرو با اعداد زنده‌ی سرور؛ هر دقیقه خودکار تازه می‌شود (آخرین: ${esc(hhmm(d.at))}).</p>
      <div class="pills">
        <span class="pill ok">سرور سالم</span>
        <span class="pill ${d.storage === 'oracle' ? 'ok' : 'bad'}">پایگاه داده: ${d.storage === 'oracle' ? 'Oracle' : esc(d.storage)}</span>
        <span class="pill ${d.files ? 'ok' : 'bad'}">Object Storage ${d.files ? 'وصل' : 'وصل نیست'}</span>
        <span class="pill">بالا از ${dur(d.up)} پیش</span>
        <span class="pill">نسخه <span class="num">${esc(d.commit || d.version || '–')}</span></span>
        <span class="pill">Node <span class="num">${esc(d.node)}</span></span>
      </div>

      <div class="box users"><h3>کاربران برنامه</h3><p>سایت · اپ اندروید (گوگل پلی) · <span class="num">${fa(d.users)}</span> حساب</p></div>
      <div class="arrow">↓</div>
      <div class="box"><h3>Cloudflare</h3><p>دامنه · تونل امن به سرور · گواهی SSL · کش و محافظت</p></div>
      <div class="arrow">↓</div>
      <section class="server">
        <header><h2>Oracle Ampere A1 · ampere-lab</h2><span class="chip">${fa(host.cpus || 2)} OCPU · ${mb(host.memory)}</span></header>
        <div class="grid">
          <div class="cell"><h4>بخش سرور (Node.js)</h4><p>ورود، آزمون‌ها، پرداخت، اخبار، ساخت تصاویر · حافظه‌ی فعلی <span class="num">${rss != null ? rss + ' MB' : '–'}</span></p></div>
          <div class="cell"><h4>سایت و پنل ادمین</h4><p>نسخه‌ی وب برنامه · ایجاد تصاویر · داشبورد · همین صفحه</p></div>
          <div class="cell"><h4>کارهای پس‌زمینه</h4><p>ساخت تصویر · پشتیبان شبانه · ثبت آمار هر دقیقه</p></div>
          <div class="cell"><h4>محافظ systemd</h4><p>حافظه‌ی رزرو و سقف <span class="num">3 GB</span> · اولویت پردازنده · فقط‌خواندنی جز پوشه‌ی داده</p></div>
        </div>
      </section>
      <div class="arrow">⇅</div>
      <div class="two">
        <div class="box"><h3>Object Storage</h3><p>تصاویر · نسخه‌های پشتیبان</p><p class="num" style="margin-top:6px">${s.bucket ? `${fa(s.bucket.files)} files · ${mb(s.bucket.bytes)}` : '–'}</p></div>
        <div class="box"><h3>Autonomous Database</h3><p>حساب‌ها · آزمون‌ها · بردارهای RAG</p><p class="num" style="margin-top:6px">${mb(s.db)}</p></div>
      </div>
      <div class="arrow">⇅</div>
      <div class="box ai"><h3>AI Gateway</h3><p>امروز <span class="num">${usd(today.usd)}</span>${ai.budget ? ` از سقف <span class="num">${usd(ai.budget)}</span>` : ''} · ${fa(today.n || 0)} درخواست${today.fail ? ` · ${fa(today.fail)} ناموفق` : ''}</p>
        <p>${Object.keys(ai.models || {}).length ? 'مدل‌ها: ' + Object.entries(ai.models).map(([k, v]) => `<span class="num">${esc(k.slice(9).toLowerCase())} → ${esc(v)}</span>`).join(' · ') : 'همه‌ی بخش‌ها روی مدل پیش‌فرض (Opus)'}</p></div>

      <h2 class="sec">پایش ۲۴ ساعت اخیر</h2>
      <p class="note">${pts.length ? `${fa(pts.length)} نمونه، هر دقیقه یکی، به وقت کپنهاگ.` : 'سرور تازه آغاز به ثبت کرده است.'}</p>
      <div class="two">
        <div class="mcard"><div class="mhead"><h3>پردازنده</h3><span class="mstat">الان <b>${f1(cpu.last)}%</b> · میانگین <b>${f1(cpu.avg)}%</b> · بیشینه <b>${f1(cpu.max)}%</b></span></div>
          <div class="chart" data-c="cpu"></div><div class="legend"><span><i style="background:var(--accent)"></i>کل ماشین</span><span><i style="background:var(--c2)"></i>خود برنامه (٪ یک هسته، الان ${f1(app.last)})</span></div></div>
        <div class="mcard"><div class="mhead"><h3>حافظه</h3><span class="mstat">الان <b>${f1(mem.last)}%</b> · بیشینه <b>${f1(mem.max)}%</b> از <b>${mb(host.memory)}</b></span></div>
          <div class="chart" data-c="mem"></div></div>
        <div class="mcard wide"><div class="mhead"><h3>شبکه</h3><span class="mstat">دریافت: میانگین <b>${f1(rx.avg)} kB/s</b> · بیشینه <b>${f1(rx.max)} kB/s</b> · ارسال: میانگین <b>${f1(tx.avg)} kB/s</b></span></div>
          <div class="chart" data-c="net"></div><div class="legend"><span><i style="background:var(--accent)"></i>دریافت</span><span><i style="background:var(--c2)"></i>ارسال</span></div></div>
        <div class="mcard wide"><div class="mhead"><h3>فضای ذخیره</h3><span class="mstat">${s.at ? 'اندازه‌گیری ' + esc(hhmm(s.at)) : ''}</span></div>
          <div class="bars">
            ${s.disk ? meter('دیسک سرور', s.disk.used, s.disk.total, `${mb(s.disk.used)} / ${mb(s.disk.total)}`) : ''}
            ${s.bucket ? meter('Object Storage', s.bucket.bytes, 20e9, `${mb(s.bucket.bytes)} / 20 GB`) : ''}
            ${s.db ? meter('Autonomous Database', s.db, 20e9, `${mb(s.db)} / 20 GB`) : ''}
          </div></div>
      </div>

      <h2 class="sec">هوش مصنوعی</h2>
      <div class="two">
        <div class="mcard"><div class="mhead"><h3>امروز به تفکیک بخش</h3><span class="mstat"><b>${usd(today.usd)}</b></span></div>
          ${Object.keys(today.tasks).length ? `<table>${Object.entries(today.tasks).sort((a, b) => b[1].usd - a[1].usd).map(([k, x]) => `<tr><td>${esc(k)}</td><td>${fa(x.n)}${x.fail ? ` (${fa(x.fail)} ✕)` : ''}</td><td class="num">${x.in || x.out ? usd(x.usd) : '—'}</td></tr>`).join('')}</table>` : '<p class="note">امروز هنوز درخواستی نبوده است.</p>'}</div>
        <div class="mcard"><div class="mhead"><h3>۱۴ روز اخیر</h3><span class="mstat">جمع <b>${usd((ai.days || []).reduce((a, x) => a + x.usd, 0))}</b></span></div>
          <div style="display:flex;align-items:flex-end;gap:3px;height:90px;direction:ltr">${(ai.days || []).map(x => { const mx = Math.max(0.0001, ...(ai.days || []).map(y => y.usd)); return `<div title="${esc(x.day)}: ${usd(x.usd)}" style="flex:1;min-width:4px;height:${Math.max(2, Math.round(x.usd / mx * 86))}px;background:var(--accent);border-radius:3px 3px 0 0;opacity:.85"></div>`; }).join('') || '<p class="note">داده‌ای نیست.</p>'}</div></div>
        <div class="mcard"><div class="mhead"><h3>RAG (جستجوی معنایی)</h3><span class="pill ${ragReady ? 'ok' : ''}">${ragReady ? 'فعال' : 'در انتظار فهرست درس‌ها'}</span></div>
          <p class="note">${fa(rag.questions || 0)} سؤال · ${fa(rag.vectors || 0)} بردار ${rag.persisted ? 'در ستون VECTOR اوراکل' : 'در حافظه'} · مدل <span class="num">${esc(rag.model || '–')}</span></p></div>
        <div class="mcard"><div class="mhead"><h3>پشتیبان‌ها</h3><span class="mstat">${fa((d.backups || []).length)} نسخه</span></div>
          ${(d.backups || []).length ? `<table>${d.backups.slice(0, 5).map(b => `<tr><td class="num">${esc(b.name)}</td><td class="num">${(b.size / 1e3).toFixed(0)} kB</td></tr>`).join('')}</table>` : '<p class="note">هنوز پشتیبانی نیست.</p>'}</div>
      </div>

      <h2 class="sec">امنیت و نگهداری</h2>
      <div class="ops">
        <div class="box"><span class="tag">کلیدها</span><h3>Oracle Vault</h3><p>هر کلید یک secret جدا · فقط همین فهرست خوانده می‌شود · سرور فقط اجازه‌ی خواندن دارد</p></div>
        <div class="box"><span class="tag">پشتیبان</span><h3>پشتیبان شبانه</h3><p>هر شب بعد از ساعت ۳ در Object Storage · ۱۴ نسخه‌ی آخر</p></div>
        <div class="box"><span class="tag">پایش</span><h3>هشدارها</h3><p>گیت‌هاب هر ۱۵ دقیقه سایت را بررسی می‌کند · اوراکل برای حافظه، پردازنده و قطعی ایمیل می‌فرستد</p></div>
        <div class="box"><span class="tag">انتشار</span><h3>CI/CD با GitHub</h3><p>هر تغییر پیش از ادغام آزمایش می‌شود · نسخه‌ای که بالا نیاید خودکار برمی‌گردد</p></div>
      </div>

      <h2 class="sec">آزمون ظرفیت: ۱۰۰۰ کاربر همزمان (۳۱ اکتبر)</h2>
      <div class="kpis">
        <div class="kpi"><b>0%</b><span>خطا</span></div>
        <div class="kpi"><b>128,632</b><span>درخواست · حدود ۳۵۰ در ثانیه</span></div>
        <div class="kpi"><b>129–185 ms</b><span>زمان پاسخ ۹۵٪</span></div>
        <div class="kpi"><b>220 MB</b><span>بیشینه‌ی حافظه‌ی برنامه</span></div>
      </div>

      <h2 class="sec">تصمیم‌های معماری</h2>
      <div class="ops">
        <div class="box"><span class="tag">RAG</span><h3>جستجوی معنایی</h3><p>برای هر جستجو فقط ۲۰ بخش مرتبط و ۶ سؤال به Claude می‌رود، نه کل فهرست</p></div>
        <div class="box"><span class="tag">Redis</span><h3>فعلاً لازم نیست</h3><p>با سرور دوم یا مصرف پایدار بالای ۷۰٪ یک هسته دوباره بررسی می‌شود</p></div>
        <div class="box wide"><span class="tag">NestJS</span><h3>بازنویسی نمی‌شود</h3><p>همه‌ی قابلیت‌ها روی همین سرور Node.js ساخته شد و آزمون ظرفیت گلوگاهی نشان نداد</p></div>
      </div>

      <h2 class="sec">چه چیزی کجا ذخیره می‌شود</h2>
      <div class="tblw"><table>
        <thead><tr><th>داده</th><th>محل</th></tr></thead>
        <tbody>
          <tr><td>حساب‌ها، آزمون‌ها، نشان‌شده‌ها، تنظیمات</td><td>Autonomous Database</td></tr>
          <tr><td>فهرست تصاویر، تصمیم‌های ادمین، اخبار، آمار سرور</td><td>Autonomous Database</td></tr>
          <tr><td>بردارهای معنایی جستجو (RAG)، مصرف هوش مصنوعی</td><td>Autonomous Database</td></tr>
          <tr><td>تصاویر و نسخه‌های پشتیبان</td><td>Object Storage</td></tr>
          <tr><td>کلیدها و رمزها</td><td>Oracle Vault</td></tr>
          <tr><td>سؤال‌ها و متن درس‌ها</td><td>کد برنامه در GitHub</td></tr>
        </tbody>
      </table></div>`;
    const series = k => pts.filter(p => p[k] != null).map(p => [p.t, p[k]]);
    const C = { cpu: () => [[{ data: series('cpu'), color: 'var(--accent)' }, { data: series('app').map(([t, v]) => [t, v / (host.cpus || 2)]), color: 'var(--c2)' }], '%', 100],
      mem: () => [[{ data: series('mem'), color: 'var(--accent)' }], '%', 100], net: () => [[{ data: series('rx'), color: 'var(--accent)' }, { data: series('tx'), color: 'var(--c2)' }], 'k'] };
    document.querySelectorAll('[data-c]').forEach(b => { const [s2, u, top] = C[b.dataset.c](); draw(b, s2, u, top); });
    document.getElementById('re').onclick = load;
  }
  async function load() {
    try { D = await api('system'); render(); }
    catch (e) { if (e.message !== 'sign in') $app.innerHTML = `<p class="lead">خطا: ${esc(e.message)}</p>`; }
  }
  load();
  setInterval(() => { if (!document.hidden) load(); }, 60e3);
  window.addEventListener('resize', () => { if (D) render(); });
})();
</script>
