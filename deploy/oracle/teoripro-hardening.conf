# Teoripro's service fenced in on a server shared with other work (Mojtaba 2026-10-31), a drop-in beside
# teoripro.service: /etc/systemd/system/teoripro.service.d/hardening.conf (setup.sh puts it there).
# - It may write only its data folder (the dashboard's Google Play key and SMTP settings); the rest of the system, the
#   other users' homes, the devices and the kernel's settings are out of its reach, and it can never gain more rights.
# - Its share of the machine: half a gigabyte of memory always kept for it, at most 3 GB, and twice the others' weight
#   for the processor and the disk when the server is busy (all of them when it is not).
# To take it off: delete the file, then `systemctl daemon-reload && systemctl restart teoripro`.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/opt/teoripro/data
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
MemoryMin=512M
MemoryMax=3G
CPUWeight=200
IOWeight=200
TasksMax=512
