# DigitalOcean App Platform spec.
# Create the app with:  doctl apps create --spec .do/app.yaml
# (or in the dashboard: Create App → GitHub → mojtabafld/driverlicense — it detects this file).
# After the first deploy, add INVITE_CODE as an encrypted environment variable in the dashboard
# (Settings → web → Environment Variables) so only people you invite can sign up.
name: teoriprove
region: fra
services:
  - name: web
    github:
      repo: mojtabafld/driverlicense
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci --omit=dev
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/config
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
databases:
  - name: db
    engine: PG
    production: false
